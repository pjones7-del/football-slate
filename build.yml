# Builds the college football slate from ESPN and publishes it to GitHub Pages.
# Runs Thursday 6:15 AM Arizona (13:15 UTC) and again Saturday 6:00 AM Arizona for fresher lines.
# Run it by hand any time: Actions tab, "Build slate", "Run workflow".
name: Build slate

on:
  schedule:
    - cron: "15 13 * * 4"
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-slate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build this week's slate
        run: |
          # template = the slate file touched most recently in git history (a renderer fix uploaded by hand wins over older weeks)
          T=$(git log --format= --name-only -- 'cfb-slate-week*.html' | awk 'NF' | head -1)
          echo "template: $T"
          python3 build_slate.py --template "$T" --index index.html --summary summary.txt --artifact none

      - name: Commit and publish
        run: |
          git config user.name "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          git add -A
          git commit -m "Slate build $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing changed"
          git push
